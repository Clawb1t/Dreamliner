# Default server configuration for Dreamliner.
# Download via /config template, edit, then upload via /config upload.
# Only include keys you want to override - missing keys inherit these defaults.

emojis:
  success: "<:blurplecheck:1533947878668763278>"
  error: "<:redcheck:1533947951481749504>"
  neutral: "<:greycheck:1533948078615298148>"
  warning: "<:warning:1533948583995244734>"
  unchecked: "<:greycheck:1533948078615298148>"

# Map role or user snowflakes to permission levels (higher = more access).
# `levels: {}` is empty. To add entries, replace with indented keys (no braces):
# levels:
#   "ROLE_OR_USER_ID": 100
#   "ROLE_OR_USER_ID": 50
levels: {}

# Server events: joins, leaves, edits, deletes, voice activity, role/nickname changes
server_log_channel_id: "1111111111111111111"

# Moderation: infractions, automod, /clean, voice mod, cases, expirations
moderation_log_channel_id: "1111111111111111111"

# When true, command replies are only visible to the user who ran the command.
ephemeral_responses: false

# Public server page accent (decimal 0–16777215). Used on /server/:id, leaderboard, and public stats.
server_accent_color: 5661429

# When true, personal user accents are hidden on this server's public leaderboard.
leaderboard_override_user_accents: false

# Which Stats tabs are public on /server/:id/stats (messagers leaderboard is always public).
public_stats:
  overview: false
  activity: false
  membership: false
  engagement: false
  patterns: false
  leaders: false
  table: false

# Server default language for /translate and auto-translate (ISO code).
default_language: en

